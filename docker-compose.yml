services:
  # 🪣 MinIO - S3-Compatible Cloud-Native Parquet Data Lake
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: careerflow-minio
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # 🧪 MLflow - Model Registry, Parameter Logging & Experiment Workspace
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: careerflow-mlflow
    ports:
      - "5000:5000"   # MLflow Tracking API / UI
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - mlflow_metadata:/mlflow
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri sqlite:///mlflow/mlflow.db 
      --default-artifact-root s3://mlflow-artifacts/
    depends_on:
      - minio
    restart: always

  # 🌪️ Prefect Server - Modern Pipeline Flow & DAG Dependency Orchestrator
  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: careerflow-prefect
    ports:
      - "4200:4200"   # Prefect Server Dashboard UI
    environment:
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    restart: always

volumes:
  minio_data:
  mlflow_metadata:
  prefect_data:
